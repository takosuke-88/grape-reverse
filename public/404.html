<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません（404）｜GrapeReverse</title>
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <!--
      Vercelは静的出力ルートの404.htmlを、存在しないURLに対して
      HTTP 404ステータス付きで配信する。SPA本体（index.html）とは別物であり、
      Reactを読み込まない完全に自己完結した静的ページとして作る。
      （React側で404画面を出す方式はHTTP 200になってしまうため採用しない）
      ビルド済みCSSはハッシュ付きファイル名で参照できないため、
      スタイルはすべてこのファイル内にインラインで持たせる。
    -->
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --text: #ffffff;
          --muted: #cbd5e1;
          --border: #334155;
          --accent: #6366f1;
          --accent-hover: #818cf8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      .brand {
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-decoration: none;
        margin-bottom: 20px;
      }
      .code {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        margin: 0 0 12px;
        color: var(--accent);
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
        margin: 0 0 28px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        display: block;
        padding: 14px 20px;
        border-radius: 9999px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: opacity 0.2s, background-color 0.2s;
      }
      .btn:active {
        opacity: 0.75;
      }
      .btn-primary {
        background: var(--accent);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-secondary {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="brand" href="/">GrapeReverse</a>
      <p class="code">404</p>
      <h1>ページが見つかりません</h1>
      <p>
        お探しのページは削除されたか、URLが変更された可能性があります。<br />
        以下からお探しのコンテンツへ移動できます。
      </p>
      <div class="links">
        <a class="btn btn-primary" href="/">ホームへ戻る</a>
        <a class="btn btn-secondary" href="/#juggler">設定判別ツール一覧を見る</a>
        <a class="btn btn-secondary" href="/columns">攻略コラム一覧を見る</a>
      </div>
    </div>
  </body>
</html>
